<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArchAppli — Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1B4332 0%, #1a5c45 30%, #1A759F 100%);
      position: relative;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      animation: blobMove 12s ease-in-out infinite alternate;
    }
    .blob-1 { width: 520px; height: 520px; background: #2D6A4F; top: -120px; left: -100px; animation-delay: 0s; }
    .blob-2 { width: 400px; height: 400px; background: #1A759F; bottom: -80px; right: -80px; animation-delay: 4s; }
    .blob-3 { width: 280px; height: 280px; background: #52B788; top: 40%; left: 55%; animation-delay: 7s; }
    @keyframes blobMove {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.08); }
    }

    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      margin: 24px;
      background: rgba(180, 210, 195, 0.22);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 28px;
      padding: 48px 40px 40px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.25);
      animation: cardIn 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(32px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }
    .logo-box {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(145deg, #2D6A4F, #52B788);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(45,106,79,0.45);
      overflow: hidden;
    }
    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .app-title {
      text-align: center;
      font-size: 36px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .app-tagline {
      text-align: center;
      font-size: 14px;
      font-weight: 400;
      color: rgba(255,255,255,0.65);
      margin-bottom: 36px;
      letter-spacing: 0.2px;
    }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      padding: 16px 20px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 14px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .field input::placeholder { color: rgba(255,255,255,0.35); }
    .field input:focus {
      border-color: rgba(82, 183, 136, 0.7);
      background: rgba(255,255,255,0.18);
      box-shadow: 0 0 0 3px rgba(82,183,136,0.2);
    }

    .btn-connect {
      width: 100%;
      margin-top: 8px;
      padding: 17px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #2D6A4F 0%, #52B788 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(45,106,79,0.5);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    }
    .btn-connect:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(45,106,79,0.6); }
    .btn-connect:active { transform: translateY(0); opacity: 0.9; }
    .btn-connect svg { transition: transform 0.2s; }
    .btn-connect:hover svg { transform: translateX(4px); }

    .btn-connect.loading { pointer-events: none; opacity: 0.8; }
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .btn-connect.loading .spinner { display: block; }
    .btn-connect.loading .btn-arrow { display: none; }
    .btn-connect.loading .btn-text::after { content: "..."; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      display: none;
      background: rgba(231,111,81,0.18);
      border: 1px solid rgba(231,111,81,0.4);
      border-radius: 10px;
      color: #ffb4a0;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 14px;
      margin-top: 12px;
      text-align: center;
    }
    .error-msg.visible { display: block; }

    @media (max-width: 480px) {
      .card { padding: 36px 24px 32px; margin: 16px; }
      .app-title { font-size: 30px; }
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="card">

    <!-- Logo -->
    <div class="logo-wrapper">
      <div class="logo-box">
        <!--
          ╔══════════════════════════════════════════════════════╗
          ║  LOGO — OPTION 1 (fichier local)                    ║
          ║                                                      ║
          ║  1. Placez votre fichier image (ex: logo.png)        ║
          ║     dans le MÊME dossier que ce fichier .html        ║
          ║                                                      ║
          ║  2. Remplacez "logo.png" ci-dessous par le nom       ║
          ║     exact de votre fichier image                     ║
          ║                                                      ║
          ║  Exemples valides :                                  ║
          ║    src="logo.png"                                    ║
          ║    src="mon-logo.jpg"                                ║
          ║    src="images/logo.png"  (si dans un sous-dossier)  ║
          ╚══════════════════════════════════════════════════════╝
        -->
        <img src="logo.png" alt="ArchAppli logo" />
      </div>
    </div>

    <h1 class="app-title">ArchAppli</h1>
    <p class="app-tagline">Collecte intelligente. Impact réel.</p>

    <div class="field">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="votre@email.fr"
        autocomplete="email"
      />
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="••••••••"
        autocomplete="current-password"
      />
    </div>

    <button class="btn-connect" id="loginBtn" onclick="handleLogin()">
      <span class="btn-text">Se connecter</span>
      <svg class="btn-arrow" width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M3 9H15M15 9L10 4M15 9L10 14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="spinner"></div>
    </button>

    <div class="error-msg" id="errorMsg">
      Email ou mot de passe incorrect. Veuillez réessayer.
    </div>

  </div>

  <script>
    function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMsg');

      errorMsg.classList.remove('visible');

      if (!email || !password) {
        errorMsg.textContent = 'Veuillez remplir tous les champs.';
        errorMsg.classList.add('visible');
        return;
      }

      btn.classList.add('loading');

      setTimeout(() => {
        btn.classList.remove('loading');

        if (email === 'admin@archappli.fr') {
          // Redirection Admin → décommentez la ligne suivante quand votre page est prête :
          // window.location.href = '/admin/dashboard.html';
          alert('✅ Connexion Admin réussie !');
        } else if (email === 'driver@archappli.fr') {
          // Redirection Conducteur → décommentez la ligne suivante quand votre page est prête :
          // window.location.href = '/driver/route.html';
          alert('✅ Connexion Conducteur réussie !');
        } else {
          errorMsg.textContent = 'Email ou mot de passe incorrect. Veuillez réessayer.';
          errorMsg.classList.add('visible');
        }
      }, 1400);
    }

    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('email').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('password').focus();
    });
  </script>

</body>
</html>
